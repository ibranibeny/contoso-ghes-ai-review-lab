name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ai-review-runners
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -r requirements.txt
          .venv/bin/python -m pytest -q
