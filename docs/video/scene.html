<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Scene</title>
<style>
  :root { --blue:#0f6cbd; --ink:#1b1f24; --muted:#5b6470; --line:#e3e7ec; --soft:#f5f7fa; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; background: #fff; overflow: hidden;
    font-family: "Segoe UI", "Inter", "DejaVu Sans", Arial, sans-serif; color: var(--ink); }
  .frame { position: absolute; inset: 0; padding: 64px 84px 70px; display: flex; flex-direction: column; }
  .brand { font-size: 22px; color: var(--muted); letter-spacing: .2px; display: flex; gap: 14px; align-items: center; }
  .brand b { color: var(--ink); font-weight: 600; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--blue); display: inline-block; }
  .chip { align-self: flex-start; margin-top: 34px; font-size: 22px; font-weight: 600; color: var(--blue);
    background: #e8f1fb; border-radius: 999px; padding: 8px 20px; }
  h1 { font-size: 64px; line-height: 1.08; font-weight: 700; letter-spacing: -0.8px; margin-top: 18px; }
  .sub { font-size: 30px; color: var(--muted); margin-top: 16px; line-height: 1.35; max-width: 1500px; }
  .body { flex: 1; display: flex; gap: 56px; margin-top: 36px; min-height: 0; }
  .left { width: 560px; flex: none; display: flex; flex-direction: column; gap: 22px; }
  .left li { list-style: none; font-size: 28px; line-height: 1.38; padding-left: 34px; position: relative; color: #2b3138; }
  .left li::before { content: ""; position: absolute; left: 0; top: 14px; width: 14px; height: 14px; border-radius: 4px; background: var(--blue); }
  .right { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
  .shot { flex: 1; min-height: 0; border: 1px solid var(--line); border-radius: 18px; background: var(--soft);
    box-shadow: 0 18px 50px rgba(20, 40, 70, .12); overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .shot img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; background: #fff; }
  .shot.top img { align-self: flex-start; }
  .cap { font-size: 22px; color: var(--muted); }
  .wide .left { display: none; }
  .progress { position: absolute; left: 84px; right: 84px; bottom: 34px; height: 6px; background: var(--line); border-radius: 6px; }
  .progress i { display: block; height: 100%; background: var(--blue); border-radius: 6px; }
  .title .frame { justify-content: center; }
  .title h1 { font-size: 92px; max-width: 1500px; }
  .title .sub { font-size: 36px; }
  .tags { display: flex; gap: 16px; margin-top: 44px; flex-wrap: wrap; }
  .tags span { font-size: 26px; padding: 10px 22px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
  .flow { display: flex; gap: 18px; align-items: stretch; margin-top: 30px; }
  .flow div { flex: 1; border: 1px solid var(--line); border-radius: 16px; padding: 24px; background: #fff; font-size: 25px; line-height: 1.35; }
  .flow div b { display: block; color: var(--blue); font-size: 22px; margin-bottom: 8px; }
  .shot.cover img { width: 100%; height: 100%; max-width: none; max-height: none; object-fit: cover; }
  .term { flex: 1; background: #0d1117; border-radius: 18px; padding: 34px 40px; color: #c9d1d9;
    font: 25px/1.55 "Cascadia Code", "DejaVu Sans Mono", Consolas, monospace; overflow: hidden; box-shadow: 0 18px 50px rgba(20,40,70,.16); }
  .term .bar { color: #8b949e; font-size: 20px; margin-bottom: 18px; }
  .term .hl { color: #7ee787; } .term .tool { color: #79c0ff; } .term .warn { color: #ffa657; }
  .quote { flex: none; align-self: flex-start; border: 1px solid var(--line); border-left: 10px solid #bc4b09; border-radius: 18px; padding: 40px 48px; background: #fff;
    box-shadow: 0 18px 50px rgba(20,40,70,.12); }
  .quote .sev { display: inline-block; font-size: 24px; font-weight: 700; color: #bc4b09; background: #fff4ec; border-radius: 10px; padding: 6px 16px; }
  .quote h2 { font-size: 44px; margin: 22px 0 18px; }
  .quote p { font-size: 32px; line-height: 1.45; color: #2b3138; }
  .quote .src { font-size: 22px; color: var(--muted); margin-top: 26px; }
</style></head>
<body><div id="root"></div>
<script>
const id = new URLSearchParams(location.search).get("id");
const esc = s => String(s || "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function render(data) {
  const scenes = data.scenes, i = scenes.findIndex(s => s.id === id), s = scenes[i];
  const pct = Math.round(100 * (i + 1) / scenes.length);
  const brand = `<div class="brand"><span class="dot"></span><b>Contoso</b> AI code review for GitHub Enterprise Server</div>`;
  let html;
  if (s.layout === "title") {
    document.body.className = "title";
    html = `<div class="frame">${brand}<h1>${esc(s.title)}</h1><div class="sub">${esc(s.sub)}</div>
      <div class="tags">${(s.tags || []).map(t => `<span>${esc(t)}</span>`).join("")}</div></div>`;
  } else if (s.layout === "flow") {
    html = `<div class="frame">${brand}<div class="chip">${esc(s.chapter)}</div><h1>${esc(s.title)}</h1>
      <div class="sub">${esc(s.sub || "")}</div>
      <div class="flow">${(s.steps || []).map(x => `<div><b>${esc(x[0])}</b>${esc(x[1])}</div>`).join("")}</div></div>`;
  } else if (s.layout === "log") {
    const line = l => { let t = esc(l);
      t = t.replace(/(tool [a-z_]+__[a-z_]+)/g, '<span class="tool">$1</span>').replace(/(-&gt; \d+ tools|request_changes|success)/g, '<span class="hl">$1</span>');
      return t; };
    html = `<div class="frame">${brand}<div class="chip">${esc(s.chapter)}</div><h1>${esc(s.title)}</h1>
      <div class="body"><ul class="left">${(s.bullets || []).map(b => `<li>${esc(b)}</li>`).join("")}</ul>
      <div class="right"><div class="term"><div class="bar">${esc(s.caption || "")}</div>${(s.lines || []).map(line).join("<br>")}</div></div></div></div>`;
  } else if (s.layout === "quote") {
    html = `<div class="frame">${brand}<div class="chip">${esc(s.chapter)}</div><h1>${esc(s.title)}</h1>
      <div class="body"><ul class="left">${(s.bullets || []).map(b => `<li>${esc(b)}</li>`).join("")}</ul>
      <div class="right"><div class="quote"><span class="sev">${esc(s.sev)}</span><h2>${esc(s.heading)}</h2><p>${esc(s.text)}</p>
      <div class="src">${esc(s.caption || "")}</div></div></div></div></div>`;
  } else {
    if (s.layout === "wide") document.body.className = "wide";
    html = `<div class="frame">${brand}<div class="chip">${esc(s.chapter)}</div><h1>${esc(s.title)}</h1>
      <div class="body"><ul class="left">${(s.bullets || []).map(b => `<li>${esc(b)}</li>`).join("")}</ul>
      <div class="right"><div class="shot ${s.align || ""} ${s.fit || ""}"><img src="${s.image}" style="object-position:${s.pos || "50% 0%"}"></div><div class="cap">${esc(s.caption || "")}</div></div></div></div>`;
  }
  document.getElementById("root").innerHTML = html + `<div class="progress"><i style="width:${pct}%"></i></div>`;
}
fetch("scenes.json").then(r => r.json()).then(render).catch(() => {
  const x = new XMLHttpRequest(); x.open("GET", "scenes.json", false); x.send(); render(JSON.parse(x.responseText));
});
</script></body></html>
